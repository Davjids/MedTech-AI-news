<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tech Curator Briefing</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --accent: #38bdf8;
      --text: #f8fafc;
      --subtext: #94a3b8;
    }
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      line-height: 1.6;
      margin: 0;
      padding: 20px;
    }
    .container { max-width: 680px; margin: 0 auto; }
    h1 { color: var(--accent); font-size: 1.8rem; border-bottom: 2px solid #334155; padding-bottom: 10px; }
    .card {
      background: var(--card);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.3);
      border: 1px solid #334155;
    }
    code { background: #0f172a; padding: 2px 6px; border-radius: 4px; color: var(--accent); }
    blockquote { border-left: 4px solid var(--accent); margin: 0; padding-left: 15px; color: var(--subtext); }
  </style>
</head>
<body>
  <div class="container">
    <div id="content">Loading Daily Brief...</div>
  </div>
  <script>
    fetch('content.md')
      .then(res => res.text())
      .then(text => {
        document.getElementById('content').innerHTML = marked.parse(text);
      })
      .catch(() => {
        document.getElementById('content').innerHTML = "<p>No content generated yet!</p>";
      });
  </script>
</body>
</html>
